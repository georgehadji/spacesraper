# Author: Georgios-Chrysovalantis Chatzivantsidis
# Project: Spacescraper (Enterprise Docker Compose)
# Role: Production-grade infrastructure with Kafka, PostgreSQL, and observability.

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Database Layer
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ss-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spacescraper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spacescraper-network

  # ---------------------------------------------------------------------------
  # Message Queue Layer
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ss-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - spacescraper-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ss-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - spacescraper-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ss-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - spacescraper-network

  # ---------------------------------------------------------------------------
  # Caching Layer
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8-alpine
    container_name: ss-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spacescraper-network

  # ---------------------------------------------------------------------------
  # Observability Layer
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.48
    container_name: ss-jaeger
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "14268:14268"  # Jaeger thrift
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - spacescraper-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: ss-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - spacescraper-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: ss-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - spacescraper-network

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-api-gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - VALKEY_URL=valkey://valkey:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_ENDPOINT=http://jaeger:4317
      - OTEL_TRACING_ENABLED=true
      - OTEL_METRICS_ENABLED=true
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - spacescraper-network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]

  scraper-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-scraper-1
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - VALKEY_URL=valkey://valkey:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_ENDPOINT=http://jaeger:4317
      - OTEL_TRACING_ENABLED=true
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
      - kafka
    networks:
      - spacescraper-network
    command: ["python", "worker_scraper.py"]
    deploy:
      resources:
        limits:
          memory: 2G

  scraper-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-scraper-2
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - VALKEY_URL=valkey://valkey:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_ENDPOINT=http://jaeger:4317
      - OTEL_TRACING_ENABLED=true
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
      - kafka
    networks:
      - spacescraper-network
    command: ["python", "worker_scraper.py"]
    deploy:
      resources:
        limits:
          memory: 2G

  processor-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-processor-1
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - VALKEY_URL=valkey://valkey:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_ENDPOINT=http://jaeger:4317
      - OTEL_TRACING_ENABLED=true
      - AI_ENABLED=true
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
      - kafka
    networks:
      - spacescraper-network
    command: ["python", "worker_processor.py"]

  processor-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-processor-2
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - VALKEY_URL=valkey://valkey:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_ENDPOINT=http://jaeger:4317
      - OTEL_TRACING_ENABLED=true
      - AI_ENABLED=true
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
      - kafka
    networks:
      - spacescraper-network
    command: ["python", "worker_processor.py"]

  reporter-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-reporter
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - VALKEY_URL=valkey://valkey:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_ENDPOINT=http://jaeger:4317
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
      - kafka
    networks:
      - spacescraper-network
    command: ["python", "worker_reporter.py"]

  # ---------------------------------------------------------------------------
  # Scheduled Jobs (Optional)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-scheduler
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - VALKEY_URL=valkey://valkey:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
      - kafka
    networks:
      - spacescraper-network
    command: ["python", "scheduler.py"]

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  valkey_data:
  prometheus_data:
  grafana_data:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  spacescraper-network:
    driver: bridge
