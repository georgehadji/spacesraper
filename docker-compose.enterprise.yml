# Author: Georgios-Chrysovalantis Chatzivantsidis
# Project: Spacescraper (Enterprise Docker Compose)
# Role: Production-grade infrastructure with PostgreSQL, Valkey, and observability.

services:
  # ---------------------------------------------------------------------------
  # Database Layer
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ss-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spacescraper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spacescraper-network

  # ---------------------------------------------------------------------------
  # Caching Layer
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8-alpine
    container_name: ss-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spacescraper-network

  # ---------------------------------------------------------------------------
  # Observability Layer
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: ss-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - spacescraper-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: ss-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - spacescraper-network

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-api-gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - PERSISTENCE_BACKEND=postgres
      - VALKEY_URL=valkey://valkey:6379/0
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - spacescraper-network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]

  scraper-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-scraper-1
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - PERSISTENCE_BACKEND=postgres
      - VALKEY_URL=valkey://valkey:6379/0
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
    networks:
      - spacescraper-network
    command: ["python", "worker_scraper.py"]
    deploy:
      resources:
        limits:
          memory: 2G

  scraper-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-scraper-2
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - PERSISTENCE_BACKEND=postgres
      - VALKEY_URL=valkey://valkey:6379/0
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
    networks:
      - spacescraper-network
    command: ["python", "worker_scraper.py"]
    deploy:
      resources:
        limits:
          memory: 2G

  processor-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-processor-1
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - PERSISTENCE_BACKEND=postgres
      - VALKEY_URL=valkey://valkey:6379/0
      - AI_ENABLED=true
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
    networks:
      - spacescraper-network
    command: ["python", "worker_processor.py"]

  processor-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-processor-2
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - PERSISTENCE_BACKEND=postgres
      - VALKEY_URL=valkey://valkey:6379/0
      - AI_ENABLED=true
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
    networks:
      - spacescraper-network
    command: ["python", "worker_processor.py"]

  reporter-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss-reporter
    environment:
      - ENVIRONMENT=production
      - DB_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/spacescraper
      - PERSISTENCE_BACKEND=postgres
      - VALKEY_URL=valkey://valkey:6379/0
      - SSRF_EGRESS_ENFORCE=true
    depends_on:
      - postgres
      - valkey
    networks:
      - spacescraper-network
    command: ["python", "worker_reporter.py"]

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  valkey_data:
  prometheus_data:
  grafana_data:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  spacescraper-network:
    driver: bridge
