[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "google-maps-scraper-main",
    "extracted_scrapers",
    "Deep-Research-*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length — not a correctness signal
    # Pre-existing violations as of W0 (2026-08-10), not yet triaged individually.
    # Tracked for a future cleanup workstream; new code should not add more of these.
    "E402",  # module-import-not-at-top-of-file
    "E701",  # multiple-statements-on-one-line-colon
    "E702",  # multiple-statements-on-one-line-semicolon
    "UP042", # replace-str-enum
    "F841",  # unused-variable
    "B007",  # unused-loop-control-variable
    "B904",  # raise-without-from-inside-except
    "B008",  # function-call-in-default-argument
    "B905",  # zip-without-explicit-strict
    "F401",  # unused-import (sole hit is in event_bus.py, slated for deletion in W6)
]

[tool.mypy]
python_version = "3.12"
files = ["src/domain"]
strict = true
namespace_packages = true
explicit_package_bases = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "google-maps-scraper-main",
    "extracted_scrapers",
]

[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "Domain layer has zero infrastructure/application imports"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = ["src.application", "src.infrastructure"]
