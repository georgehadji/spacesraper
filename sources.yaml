# Extraction overlay configuration for generic web scraping.
# Sources are now configured dynamically via the API /jobs endpoint.
# This file remains only for declarative overlay examples.

sources:
  - name: "Overlay Extraction Demo"
    enabled: false  # Set to true to test overlay-based extraction
    target_site: "universal"
    start_urls:
      - "https://books.toscrape.com/"
    overlay:
      entity_type: "generic"
      container: ".product_pod"
      mapping:
        name: "h3 a"
        price: ".price_color"
        url: "h3 a[href]"
    description: "Example of declarative extraction using schema-driven overlays."
