# Extraction Pipeline Configuration — Generic Web Extraction
# See SCRAPER_EVOLUTION_PLAN.md for the target architecture.

# --- Extraction Layer Configuration ---
extract:
  sources:
    - type: dom_harvest
      id: website_source
      description: Target web pages (HTML/DOM)
    - type: network_interception
      id: xhr_intelligence
      description: Captured JSON/XHR application traffic from the Scraper Engine
  method: incremental_discovery
  validation:
    - schema_integrity_checks
    - null_attribute_rejection
    - cluster_wide_deduplication

# --- Transformation & Enrichment Layer ---
transform:
  operations:
    - step: 1
      action: sanitation
      description: Strip noise, normalize whitespaces, and sanitize HTML artifacts.
    - step: 2
      action: normalization
      description: Resolve ISO 8601 timestamps and standardize formats.
    - step: 3
      action: extraction
      description: Schema-driven record extraction with deterministic strategies.
  error_strategy: dlq_quarantine

# --- Persistence & Load Layer ---
load:
  destinations:
    - type: local_storage
      target: /exports
      formats: [csv, json]
  mode: stateful_append
  quality_audit:
    - checksum_verification
    - entity_row_count_validation

# --- Orchestration & Infrastructure ---
orchestration:
  scheduler: hybrid_event_driven
  dependencies:
    - redis_cluster (Message Broker & Metrics Store)
    - browser_context_pool (Playwright Engine)
  observability:
    - real_time_metrics (Jobs/Success/SLA)
    - push_alerting (Slack/Discord Webhooks)
    - distributed_logging

# --- Cluster Constraints ---
constraints:
  latency: SLA < 300s (End-to-end ingestion and enrichment)
  concurrency: Scalable to 20+ concurrent scraper nodes
  cost_management:
    - Browser pooling: Reuse contexts to minimize CPU/RAM overhead.
