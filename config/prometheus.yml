global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9090']
    metrics_path: /metrics

  - job_name: 'scraper-workers'
    static_configs:
      - targets:
        - 'scraper-worker-1:9090'
        - 'scraper-worker-2:9090'

  - job_name: 'processor-workers'
    static_configs:
      - targets:
        - 'processor-worker-1:9090'
        - 'processor-worker-2:9090'
