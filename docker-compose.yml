# Author: Georgios-Chrysovalantis Chatzivantsidis
# Project: Spacescraper (Orchestration)
# Role: Multi-node cluster orchestration for production deployment.

services:
  # 🌐 API Gateway: Entry point for mission submission
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - VALKEY_URL=valkey://valkey:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: always

  # 🕷️ Scraper Node: Headless browser cluster
  scraper:
    build: .
    command: python worker_scraper.py
    environment:
      - VALKEY_URL=valkey://valkey:6379
      - SCRAPER_POOL_SIZE=3
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./exports/evidence:/app/exports/evidence
      - ./logs:/app/logs
    restart: always
    deploy:
      replicas: 2 # Scale horizontally to handle high volume

  # 🧠 Intelligence Processor: Data cleaning & persistence
  processor:
    build: .
    command: python worker_processor.py
    environment:
      - VALKEY_URL=valkey://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
      - intelligence_data:/app
    restart: always

  # 📤 Reporter Node: Side-effects (Slack, SQL Reports, Dashboards)
  reporter:
    build: .
    command: python worker_reporter.py
    environment:
      - VALKEY_URL=valkey://valkey:6379
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
    restart: always

  # 🛠️ Headless CLI: one-shot runs for external agents and scripts.
  # Not started by `up` (profile "cli"); invoke it explicitly:
  #   docker compose run --rm cli scrape https://example.com --pretty
  #   docker compose run --rm cli health
  cli:
    build: .
    profiles: ["cli"]
    entrypoint: ["python", "cli.py"]
    command: ["health"]
    environment:
      - VALKEY_URL=valkey://valkey:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs

  # 🚄 Message Broker: Task distribution hub (Valkey)
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    restart: always
    # Nodes that cannot reach the broker at startup fall back to a private
    # in-memory queue, which looks healthy but never exchanges jobs. Gate every
    # dependent service on a broker that is actually accepting commands.
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  intelligence_data: # Persist SQLite DB and reports
  valkey_data: # Persist the task queue state
